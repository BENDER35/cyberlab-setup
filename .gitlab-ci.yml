stages:
  - test
  - package

default:
  image: python:3.12-slim

test:catalog:
  stage: test
  script:
    - python3 -m py_compile install.py catalog.py scripts/verify_mirror.py
    - python3 install.py --list
    - python3 install.py --dry-run --profile core --yes

package:release:
  stage: package
  image: alpine:3.20
  script:
    - apk add --no-cache bash zip coreutils
    - bash scripts/build-release.sh "${CI_COMMIT_TAG#v}"
  artifacts:
    expire_in: 1 year
    paths:
      - dist/*.zip
      - dist/SHA256SUMS
  rules:
    - if: $CI_COMMIT_TAG
