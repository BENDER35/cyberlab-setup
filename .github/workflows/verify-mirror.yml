name: Verify GitLab mirror

on:
  schedule:
    - cron: "17 6 * * *"   # diario 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Compare GitHub and GitLab refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check token
        id: config
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "${GITLAB_TOKEN:-}" ]; then
            echo "::warning::GITLAB_TOKEN is not configured; skipping verification."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare refs
        if: steps.config.outputs.has_token == 'true'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_NAMESPACE: ${{ vars.GITLAB_NAMESPACE }}
          GITLAB_PROJECT: ${{ vars.GITLAB_PROJECT }}
        run: python3 scripts/verify_mirror.py
