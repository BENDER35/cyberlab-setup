name: Mirror to GitLab

on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Push branches and tags to GitLab
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check configuration
        id: config
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_TOKEN:-}" ]; then
            echo "::warning::GITLAB_TOKEN is not configured; skipping mirror."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! curl -fsS -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
              https://gitlab.com/api/v4/user >/dev/null; then
            echo "::error::GITLAB_TOKEN is invalid or expired."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_token=true" >> "$GITHUB_OUTPUT"

      - name: Push mirror
        if: steps.config.outputs.has_token == 'true'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_NAMESPACE: ${{ vars.GITLAB_NAMESPACE }}
          GITLAB_PROJECT: ${{ vars.GITLAB_PROJECT }}
        run: bash scripts/mirror-to-gitlab.sh

      - name: Verify mirror
        if: steps.config.outputs.has_token == 'true'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_NAMESPACE: ${{ vars.GITLAB_NAMESPACE }}
          GITLAB_PROJECT: ${{ vars.GITLAB_PROJECT }}
        run: python3 scripts/verify_mirror.py --verbose
